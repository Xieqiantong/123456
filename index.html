<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇 · Snake Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    color: #eaf6ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
    overflow: hidden;
  }
  h1 {
    font-size: clamp(22px, 4vw, 32px);
    letter-spacing: 4px;
    margin-bottom: 10px;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  .hud {
    width: min(92vw, 480px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 15px;
  }
  .hud .box {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px;
    padding: 4px 14px;
    min-width: 86px;
    text-align: center;
  }
  .hud .label { font-size: 12px; opacity: .7; }
  .hud .value { font-size: 20px; font-weight: 700; color: #ffd76e; }
  .stage {
    position: relative;
    width: min(92vw, 480px);
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
    border: 2px solid rgba(255,255,255,.18);
  }
  canvas { display: block; width: 100%; height: 100%; background: #10222b; }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(8, 20, 28, .82);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    transition: opacity .25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay .title { font-size: 26px; font-weight: 800; color: #7dffa8; }
  .overlay .sub { font-size: 14px; line-height: 1.8; opacity: .85; }
  .overlay .final { font-size: 18px; color: #ffd76e; }
  button.btn {
    border: none;
    border-radius: 999px;
    padding: 12px 34px;
    font-size: 17px;
    font-weight: 700;
    color: #06251a;
    background: linear-gradient(135deg, #7dffa8, #34d17b);
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(52,209,123,.4);
    transition: transform .15s;
  }
  button.btn:hover { transform: scale(1.06); }
  .tips {
    margin-top: 10px;
    font-size: 12.5px;
    opacity: .65;
    text-align: center;
    line-height: 1.7;
  }
  kbd {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 4px;
    padding: 0 6px;
    font-size: 12px;
  }
  /* 移动端方向键 */
  .dpad {
    display: none;
    margin-top: 14px;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
    justify-content: center;
  }
  .dpad button {
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.1);
    color: #eaf6ff;
    border-radius: 10px;
    font-size: 22px;
    cursor: pointer;
  }
  .dpad button:active { background: rgba(125,255,168,.3); }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) { .dpad { display: grid; } }
</style>
</head>
<body>

<h1>🐍 贪吃蛇</h1>

<div class="hud">
  <div class="box"><div class="label">得分</div><div class="value" id="score">0</div></div>
  <div class="box"><div class="label">最高分</div><div class="value" id="best">0</div></div>
  <div class="box"><div class="label">长度</div><div class="value" id="len">3</div></div>
</div>

<div class="stage">
  <canvas id="game" width="480" height="480"></canvas>
  <div class="overlay" id="overlay">
    <div class="title" id="ovTitle">准备好了吗？</div>
    <div class="final" id="ovFinal" style="display:none"></div>
    <div class="sub" id="ovSub">
      电脑：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制方向<br>
      <kbd>空格</kbd> 暂停 / 继续 · 撞墙或撞到自己游戏结束
    </div>
    <button class="btn" id="ovBtn">开始游戏</button>
  </div>
</div>

<div class="dpad">
  <button class="up" data-dir="up">▲</button>
  <button class="left" data-dir="left">◀</button>
  <button class="down" data-dir="down">▼</button>
  <button class="right" data-dir="right">▶</button>
</div>

<div class="tips">吃到的食物越多，蛇跑得越快 —— 挑战你的极限！</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 24;                       // 24 x 24 格
  const CELL = canvas.width / GRID;       // 每格像素

  const $score = document.getElementById('score');
  const $best = document.getElementById('best');
  const $len = document.getElementById('len');
  const $overlay = document.getElementById('overlay');
  const $ovTitle = document.getElementById('ovTitle');
  const $ovSub = document.getElementById('ovSub');
  const $ovFinal = document.getElementById('ovFinal');
  const $ovBtn = document.getElementById('ovBtn');

  let snake, dir, nextDir, food, score, best, speed, timer, state;

  best = Number(localStorage.getItem('snake_best') || 0);
  $best.textContent = best;

  function reset() {
    snake = [{x: 11, y: 12}, {x: 10, y: 12}, {x: 9, y: 12}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    speed = 160;              // 初始间隔 ms，越小越快
    placeFood();
    updateHud();
  }

  function placeFood() {
    do {
      food = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function updateHud() {
    $score.textContent = score;
    $len.textContent = snake.length;
    $best.textContent = best;
  }

  function setDir(nx, ny) {
    // 禁止 180 度掉头
    if (dir.x === -nx && dir.y === -ny) return;
    nextDir = {x: nx, y: ny};
  }

  function step() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // 撞墙 / 撞自己
    const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      if (speed > 70) speed -= 3;      // 逐渐加速
      placeFood();
      restartTimer();
    } else {
      snake.pop();
    }
    updateHud();
    draw();
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(step, speed);
  }

  function draw() {
    // 背景棋盘
    ctx.fillStyle = '#10222b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for (let y = 0; y < GRID; y++)
      for (let x = 0; x < GRID; x++)
        if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);

    // 食物（红苹果 + 高光）
    const fx = food.x * CELL, fy = food.y * CELL;
    ctx.fillStyle = '#ff5b5b';
    ctx.beginPath();
    ctx.arc(fx + CELL/2, fy + CELL/2 + 1, CELL * 0.38, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.arc(fx + CELL*0.36, fy + CELL*0.34, CELL * 0.1, 0, Math.PI * 2);
    ctx.fill();

    // 蛇身
    snake.forEach((seg, i) => {
      const t = i / Math.max(snake.length - 1, 1);
      const r = Math.round(52 + t * 40);
      const g = Math.round(220 - t * 60);
      const b = Math.round(130 + t * 40);
      ctx.fillStyle = i === 0 ? '#7dffa8' : `rgb(${r},${g},${b})`;
      const pad = i === 0 ? 1 : 2.5;
      roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad*2, CELL - pad*2, 6);
      ctx.fill();
    });

    // 蛇眼睛
    const h = snake[0];
    ctx.fillStyle = '#08220f';
    const ex = h.x * CELL + CELL/2, ey = h.y * CELL + CELL/2;
    const off = CELL * 0.18;
    const px = dir.y !== 0 ? off : 0, py = dir.x !== 0 ? off : 0;
    ctx.beginPath(); ctx.arc(ex - px + dir.x*off*0.6, ey - py + dir.y*off*0.6, 2.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + px + dir.x*off*0.6, ey + py + dir.y*off*0.6, 2.4, 0, 7); ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function gameOver() {
    clearInterval(timer);
    state = 'over';
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
    }
    updateHud();
    $ovTitle.textContent = '游戏结束';
    $ovTitle.style.color = '#ff7b7b';
    $ovFinal.style.display = 'block';
    $ovFinal.textContent = `本局得分 ${score} 分 · 蛇长 ${snake.length} · 最高分 ${best}`;
    $ovBtn.textContent = '再来一局';
    $overlay.classList.remove('hidden');
  }

  function start() {
    reset();
    state = 'playing';
    $overlay.classList.add('hidden');
    restartTimer();
    draw();
  }

  function togglePause() {
    if (state === 'playing') {
      clearInterval(timer);
      state = 'paused';
      $ovTitle.textContent = '已暂停';
      $ovTitle.style.color = '#ffd76e';
      $ovFinal.style.display = 'none';
      $ovSub.innerHTML = '按 <kbd>空格</kbd> 或点击按钮继续';
      $ovBtn.textContent = '继续';
      $overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'playing';
      $overlay.classList.add('hidden');
      restartTimer();
    }
  }

  // 键盘
  const keyMap = {
    ArrowUp: [0,-1], KeyW: [0,-1],
    ArrowDown: [0,1], KeyS: [0,1],
    ArrowLeft: [-1,0], KeyA: [-1,0],
    ArrowRight: [1,0], KeyD: [1,0],
  };
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'ready' || state === 'over') start(); else togglePause();
      return;
    }
    const m = keyMap[e.code];
    if (m && state === 'playing') { e.preventDefault(); setDir(m[0], m[1]); }
  });

  // 触屏滑动
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = e.touches[0];
  }, {passive: true});
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.clientX;
    const dy = t.clientY - touchStart.clientY;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  }, {passive: true});

  // 虚拟方向键
  document.querySelectorAll('.dpad button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state !== 'playing') return;
      const d = btn.dataset.dir;
      if (d === 'up') setDir(0,-1);
      if (d === 'down') setDir(0,1);
      if (d === 'left') setDir(-1,0);
      if (d === 'right') setDir(1,0);
    });
  });

  $ovBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause(); else start();
  });

  // 初始化
  state = 'ready';
  reset();
  draw();
})();
</script>
</body>
</html>
